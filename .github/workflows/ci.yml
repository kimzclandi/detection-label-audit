name: label-audit-evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src scripts tests dashboard.py metric_audit.py
      - run: uv run pytest -q
      - run: uv run python scripts/run.py verify
      - run: uv run python metric_audit.py
