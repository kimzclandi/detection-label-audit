[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "detection-label-audit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3", "streamlit", "pytest", "ruff"]
[tool.setuptools]
py-modules = ["label_audit"]
package-dir = {"" = "src"}
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
