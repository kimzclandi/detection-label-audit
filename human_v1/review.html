<!doctype html><html lang="zh"><meta charset="utf-8"><title>独立标签复核</title>
<style>body{font:16px system-ui;max-width:1200px;margin:24px auto;padding:12px;color:#172033}button,select,input,textarea{font:inherit;padding:8px;margin:4px}textarea{width:95%}#stage{position:relative;width:100%;background:#ddd}canvas{width:100%;display:block;cursor:crosshair}.warn{background:#fff2cb;padding:14px}label{display:inline-block}#issues{white-space:pre-wrap;background:#edf3fa;padding:10px}button{cursor:pointer}#message{color:#b32020}</style>
<h1>独立标签复核 <span id="role"></span></h1><p class="warn">这不是算法建议审阅：请完整查看原图及当前标签。不要与另一位复核者讨论、查看算法分数或用AI代判。可选择“不确定”，不要猜。未提交的案例不视为正确标签。</p>
<p>复核者代号（不要填写个人敏感信息） <input id="reviewer" placeholder="例如 reviewer-lin"> <button onclick="exportDraft()">导出草稿备份</button><input type="file" id="restore" accept="application/json"></p>
<select id="case"></select><span id="progress"></span><button onclick="changeCase(-1)">上一张</button><button onclick="changeCase(1)">下一张</button>
<p><label><input type="checkbox" id="overlay" checked>显示现有标签框及编号</label> 在图上拖拽框选问题区域；可用浏览器缩放查看细节。<a id="original" target="_blank">打开原尺寸图片</a></p>
<div id="stage"><canvas id="canvas"></canvas></div><p id="classes"></p><details><summary>现有标签坐标 / 裁决阶段参考</summary><pre id="labels"></pre></details>
<h3>记录问题证据</h3><select id="type"><option value="missing">漏标</option><option value="class">类别错误</option><option value="box">框定位/尺度错误</option><option value="duplicate">重复标注</option><option value="pipeline">坐标/类别管线问题</option></select>
<input id="region" placeholder="原图x1,y1,x2,y2，可拖拽自动填入" size="40"><textarea id="issueReason" placeholder="说明可观察证据、涉及标签编号；至少10个字符"></textarea><button onclick="addIssue()">加入该问题</button><button onclick="clearIssues()">清空本图问题草稿</button><pre id="issues"></pre>
<h3>本图结论</h3><select id="verdict"><option value="">尚未判断</option><option value="no_error_found">未发现明确标签错误</option><option value="label_error">发现明确标签错误</option><option value="unresolved">无法判断 / 需要更多证据</option></select>
<textarea id="reason" placeholder="完整检查说明 / 不确定原因（至少10个字符）"></textarea><button onclick="saveAnswer()">保存本图判断</button>
<p><label><input id="human" type="checkbox">本人实际查看原图并作出判断，非AI生成、非占位答案</label></p><p><label><input id="independent" type="checkbox">A/B首轮未查看另一复核者答案或算法建议；若为C，本人独立承担最终裁决并重新查看原图</label></p><button onclick="submit()">导出本人复核提交JSON</button><p id="message"></p>
<script>
const payload=__PAYLOAD__; const $=id=>document.getElementById(id); const key='human-v1-'+payload.protocol+'-'+payload.role;
let state=JSON.parse(localStorage.getItem(key)||'{"reviewer_id":"","answers":[]}'), current=0, issues=[], image=new Image(), start=null;
$('role').textContent=payload.role; $('reviewer').value=state.reviewer_id; $('classes').textContent=JSON.stringify(payload.classes);
payload.cases.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.case_id;$('case').append(o)});
function persist(){state.reviewer_id=$('reviewer').value.trim();localStorage.setItem(key,JSON.stringify(state));$('progress').textContent=` 已保存 ${state.answers.length}/${payload.cases.length}`;}
function draw(){const c=payload.cases[current],v=$('canvas'),ctx=v.getContext('2d');v.width=c.width;v.height=c.height;ctx.drawImage(image,0,0);ctx.lineWidth=2;ctx.font='16px sans-serif';if($('overlay').checked)c.labels.forEach((l,i)=>{const [x,y,x2,y2]=l.box;ctx.strokeStyle='#00ff5e';ctx.strokeRect(x,y,x2-x,y2-y);ctx.fillStyle='#002010';ctx.fillRect(x,Math.max(0,y-19),135,19);ctx.fillStyle='#fff';ctx.fillText('#'+i+' '+payload.classes[l.label],x,Math.max(16,y-3));});}
function load(){const c=payload.cases[current],a=state.answers.find(x=>x.case_id===c.case_id);issues=a?structuredClone(a.issues):[];$('verdict').value=a?.verdict||'';$('reason').value=a?.reason||'';$('issues').textContent=JSON.stringify(issues,null,2);$('labels').textContent=JSON.stringify({labels:c.labels,prior_reviews:payload.prior_reviews?.[c.case_id]},null,2);$('original').href='images/'+c.case_id+'.jpg';image.onload=draw;image.src=$('original').href;$('message').textContent='';persist();}
$('case').onchange=()=>{current=Number($('case').value);load()};$('overlay').onchange=draw;
function changeCase(d){current=Math.max(0,Math.min(payload.cases.length-1,current+d));$('case').value=current;load();}
function xy(e){const r=$('canvas').getBoundingClientRect(),c=payload.cases[current];return [Math.max(0,Math.min(c.width,(e.clientX-r.left)*c.width/r.width)),Math.max(0,Math.min(c.height,(e.clientY-r.top)*c.height/r.height))];}
$('canvas').onpointerdown=e=>{start=xy(e);$('canvas').setPointerCapture(e.pointerId)};$('canvas').onpointerup=e=>{if(!start)return;const end=xy(e);$('region').value=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])].map(Math.round).join(',');start=null;};
function addIssue(){const b=$('region').value.split(',').map(Number),c=payload.cases[current],r=$('issueReason').value.trim();if(b.length!==4||!b.every(Number.isFinite)||!(0<=b[0]&&b[0]<b[2]&&b[2]<=c.width&&0<=b[1]&&b[1]<b[3]&&b[3]<=c.height)||r.length<10)return $('message').textContent='请填写有效原图区域和至少10字证据。';issues.push({type:$('type').value,region:b,reason:r});$('issues').textContent=JSON.stringify(issues,null,2);$('issueReason').value='';}
function clearIssues(){issues=[];$('issues').textContent='[]'}
function saveAnswer(){const v=$('verdict').value,r=$('reason').value.trim();if(!v||r.length<10||(v==='label_error'&&!issues.length)||(v==='no_error_found'&&issues.length))return $('message').textContent='请检查结论、至少10字说明和问题证据是否一致。';const a={case_id:payload.cases[current].case_id,verdict:v,reason:r,issues:structuredClone(issues)};state.answers=state.answers.filter(x=>x.case_id!==a.case_id);state.answers.push(a);persist();$('message').textContent='本图已保存；切换前未保存的修改不会提交。';}
function download(name,x){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportDraft(){persist();download('draft-'+payload.role+'.json',{protocol:payload.protocol,role:payload.role,...state})}
function submit(){persist();if(!state.reviewer_id||!$('human').checked||!$('independent').checked)return $('message').textContent='必须填写代号并由真实复核者确认两项声明。';if(!state.answers.length)return $('message').textContent='没有已保存的判断。';download('review-'+payload.role+'.json',{protocol:payload.protocol,role:payload.role,reviewer_id:state.reviewer_id,answers:state.answers,human_attestation:true,independent_attestation:true,submitted_utc:new Date().toISOString()});}
$('restore').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.protocol!==payload.protocol||x.role!==payload.role||!Array.isArray(x.answers))throw Error();state={reviewer_id:x.reviewer_id||'',answers:x.answers};$('reviewer').value=state.reviewer_id;persist();load()}catch{$('message').textContent='草稿协议或角色不匹配，未导入。'}};load();
</script></html>
